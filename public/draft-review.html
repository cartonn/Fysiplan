<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fysiplan – conceptcontrole</title>
<style>body{font:16px system-ui;margin:24px auto;padding:0 16px;max-width:800px;color:#18304a;background:#f6f8fb}button,input{font:inherit;padding:10px;margin:4px}article{background:white;padding:16px;margin:20px 0;border:1px solid #ddd;border-radius:12px}img{display:block;width:100%;height:auto;aspect-ratio:2/3;max-height:70vh;object-fit:contain;object-position:50% 50%;background:white}small{display:block}button[aria-pressed=true]{background:#164a83;color:white}</style>
<style>video{display:block;width:100%;aspect-ratio:2/3;max-height:70vh;object-fit:contain;background:white}</style>
<h1>Conceptcontrole</h1><p>Niet gepubliceerd. Afbeeldingen, beweging en stem zijn apart te beoordelen. Geen klinische goedkeuring.</p>
<form id="login"><label>Beheersleutel <input id="key" type="password" autocomplete="off" required></label><button>Concepten laden</button></form><p id="status" role="status"></p><main id="cards"></main>
<script type="module">
const cards=document.getElementById('cards'), status=document.getElementById('status');
let urls=[];
function exclusieveMedia(media){
 media.addEventListener('play',()=>{cards.querySelectorAll('video,audio').forEach(other=>{if(other!==media)other.pause();});});
}
const clear=()=>{cards.querySelectorAll('video,audio').forEach(v=>v.pause());urls.forEach(URL.revokeObjectURL);urls=[];cards.replaceChildren();};
window.addEventListener('pagehide',clear);
document.getElementById('login').addEventListener('submit',async event=>{
 event.preventDefault();clear();status.textContent='Laden…';
 const key=document.getElementById('key').value;document.getElementById('key').value='';
 const headers={'x-admin-sleutel':key};
 try{
  const response=await fetch('/api/exercise-drafts',{headers,cache:'no-store'});
  if(!response.ok)throw Error('Conceptcontrole niet beschikbaar. Gebruik de ingestelde beheersleutel.');
  const result=await response.json();
  for(const draft of result.drafts){
   if(draft.published!==false||draft.publishable!==false)throw Error('Onverwachte conceptstatus.');
   const article=document.createElement('article'),title=document.createElement('h2'),text=document.createElement('p'),image=document.createElement('img'),label=document.createElement('p'),nav=document.createElement('div');
   title.textContent=draft.originalRecord.naam;text.textContent=draft.explanation;image.alt='';
   const frames={};
   for(const role of ['line','start','end']){
    const res=await fetch(`/api/exercise-drafts/${encodeURIComponent(draft.coreExerciseId)}/${role}`,{headers,cache:'no-store'});
    if(!res.ok)throw Error('Conceptbeeld kon niet worden gecontroleerd.');
    frames[role]=URL.createObjectURL(await res.blob());urls.push(frames[role]);
    const button=document.createElement('button');button.type='button';button.textContent=draft.assets[role].label;button.dataset.role=role;
    button.addEventListener('click',()=>show(role));nav.append(button);
   }
   function show(role){image.src=frames[role];image.alt=`${draft.originalRecord.naam}: ${draft.assets[role].label}`;label.textContent=draft.assets[role].label;for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.role===role));}
   article.append(title,text,nav,label,image);cards.append(article);show('line');
   if(draft.motionCandidate){
    const motion=draft.motionCandidate, heading=document.createElement('h3'),note=document.createElement('p'),video=document.createElement('video'),message=document.createElement('p'),load=document.createElement('button');
    heading.textContent='Bewegingsconcept – nog beoordelen';note.textContent=motion.limitations;
    video.controls=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label','Ongepubliceerd bewegingsconcept: '+draft.originalRecord.naam);
    exclusieveMedia(video);
    message.setAttribute('role','status');load.type='button';load.textContent='Bewegingsconcept laden';
    let blobUrl=null,busy=false;
    load.addEventListener('click',async()=>{
     if(busy)return;busy=true;load.disabled=true;message.textContent='Video laden…';
     try{
      const res=await fetch(`/api/exercise-drafts/${encodeURIComponent(draft.coreExerciseId)}/motion`,{headers,cache:'no-store'});
      if(!res.ok)throw Error('Video niet beschikbaar. Controleer de beheersleutel en probeer opnieuw.');
      const blob=await res.blob();if(!article.isConnected)return;
      video.pause();if(blobUrl){URL.revokeObjectURL(blobUrl);urls=urls.filter(u=>u!==blobUrl);}
      blobUrl=URL.createObjectURL(blob);urls.push(blobUrl);video.src=blobUrl;video.load();message.textContent='Gebruik afspelen om het bewegingsconcept te controleren.';
     }catch(e){if(article.isConnected)message.textContent=e.message;}
     finally{busy=false;load.disabled=false;load.textContent='Video opnieuw laden';}
    });
    video.addEventListener('error',()=>{message.textContent='Afspelen is mislukt. Laad de video opnieuw.';});
    video.addEventListener('playing',()=>{message.textContent='Bewegingsconcept; nog niet goedgekeurd.';});
    article.append(heading,note,load,message,video);
   }
   if(draft.narrationCandidate){
    const heading=document.createElement('h3'),note=document.createElement('p'),audio=document.createElement('audio'),message=document.createElement('p'),load=document.createElement('button');
    heading.textContent='Stemconcept – luisteren en beoordelen';
    note.textContent='Dit is een concept van de oefenuitleg. Controleer of de stem en de getoonde houdingen of beweging inhoudelijk overeenkomen. De stem is nog niet volledig beluisterd of klinisch goedgekeurd.';
    audio.controls=true;audio.preload='metadata';audio.setAttribute('aria-label','Ongepubliceerde oefenuitleg: '+draft.originalRecord.naam);exclusieveMedia(audio);
    message.setAttribute('role','status');load.type='button';load.textContent='Stemconcept laden';
    let audioUrl=null,busy=false;
    load.addEventListener('click',async()=>{
     if(busy)return;busy=true;load.disabled=true;message.textContent='Opname laden…';
     try{
      const res=await fetch(`/api/exercise-drafts/${encodeURIComponent(draft.coreExerciseId)}/narration`,{headers,cache:'no-store'});
      if(!res.ok)throw Error('Opname niet beschikbaar. Controleer de beheersleutel en probeer opnieuw.');
      const blob=await res.blob();if(!article.isConnected)return;
      audio.pause();if(audioUrl){URL.revokeObjectURL(audioUrl);urls=urls.filter(u=>u!==audioUrl);}
      audioUrl=URL.createObjectURL(blob);urls.push(audioUrl);audio.src=audioUrl;audio.load();message.textContent='Gebruik afspelen om de volledige uitleg te beluisteren.';
     }catch(e){if(article.isConnected)message.textContent=e.message;}
     finally{busy=false;load.disabled=false;load.textContent='Opname opnieuw laden';}
    });
    audio.addEventListener('error',()=>{message.textContent='Afspelen is mislukt. Laad de opname opnieuw.';});
    audio.addEventListener('playing',()=>{message.textContent='Stemconcept; nog niet goedgekeurd.';});
    article.append(heading,note,load,message,audio);
   }
  }
  status.textContent=`${result.drafts.length} ongepubliceerd concept. Geen wijzigingen aan trainingskaarten.`;
 }catch(error){clear();status.textContent=error.message;}
});
</script></html>
