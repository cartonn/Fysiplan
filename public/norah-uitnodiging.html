<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norah May spreekt</title>
<style>
  /* Eén visuele wereld — het roze feestje van de uitnodiging zelf.
     Bewust single-theme: alle kleuren expliciet geschilderd. */
  :root{
    --roze-lucht:#f19ac0;
    --roze-diep:#e0559b;
    --glitter:#d81b7a;
    --marine:#1d3272;
    --marine-zacht:#2a4494;
    --wit:#fff7fb;
    --room:#ffe9f3;
    --blauw:#3f7fd6;
    --schaduw:0 10px 30px rgba(120,20,80,.35);
    --display:'Chalkboard SE','Comic Sans MS','Marker Felt','Segoe Print',cursive;
    --body:ui-rounded,'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',Quicksand,Calibri,'Trebuchet MS',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:var(--body);
    color:var(--marine);
    background:
      radial-gradient(1200px 600px at 20% -10%, #ffc6de 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 30%, #f7b3d2 0%, transparent 55%),
      linear-gradient(170deg, var(--roze-lucht) 0%, var(--roze-diep) 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:1.25rem 1rem 3rem;
  }
  .hartjes{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hartjes span{
    position:absolute;font-size:1.1rem;opacity:.5;
    animation:zweef 9s ease-in-out infinite;
  }
  @keyframes zweef{
    0%,100%{transform:translateY(0) rotate(-8deg)}
    50%{transform:translateY(-22px) rotate(8deg)}
  }
  header{position:relative;z-index:1;text-align:center;margin:.5rem 0 1rem}
  .eyebrow{
    display:inline-block;background:var(--marine);color:var(--wit);
    padding:.35rem 1rem;border-radius:999px;
    font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;
  }
  h1{
    font-family:var(--display);
    font-size:clamp(2.1rem,8vw,3.4rem);
    line-height:1.05;margin:.5rem 0 .25rem;
    color:var(--glitter);
    -webkit-text-stroke:1.5px var(--wit);
    paint-order:stroke fill;
    text-shadow:0 3px 0 rgba(255,255,255,.85),0 8px 18px rgba(140,10,80,.35);
    text-wrap:balance;
  }
  .sub{margin:0;color:var(--marine);font-size:1.05rem}

  .toneel{position:relative;z-index:1;width:min(430px,94vw)}

  .ballon{
    position:relative;
    background:var(--wit);
    border-radius:22px;
    border:3px solid var(--marine);
    padding:1rem 1.1rem;
    font-size:1.15rem;line-height:1.45;
    box-shadow:var(--schaduw);
    margin-bottom:1rem;
    min-height:3.4rem;
    opacity:0;transform:translateY(8px) scale(.97);
    transition:opacity .25s ease,transform .25s ease;
  }
  .ballon.zichtbaar{opacity:1;transform:none}
  .ballon::after{
    content:"";position:absolute;left:52px;bottom:-16px;
    border:14px solid transparent;border-top-color:var(--marine);
  }
  .ballon::before{
    content:"";position:absolute;left:56px;bottom:-9px;z-index:1;
    border:10px solid transparent;border-top-color:var(--wit);
  }
  .ballon .w{opacity:.25;transition:opacity .12s}
  .ballon .w.aan{opacity:1;font-weight:700;color:var(--glitter)}

  .lijst{
    position:relative;border-radius:26px;overflow:hidden;
    border:4px solid var(--wit);
    box-shadow:var(--schaduw);
    background:var(--room);
    transform-origin:50% 90%;
  }
  .lijst.praat{animation:sway 1.1s ease-in-out infinite}
  @keyframes sway{
    0%,100%{transform:rotate(-.7deg) scale(1.005)}
    50%{transform:rotate(.7deg) scale(1.015)}
  }
  .lijst img{display:block;width:100%;height:auto}
  .dropzone{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.6rem;min-height:340px;padding:2rem 1.5rem;cursor:pointer;text-align:center;
    border:3px dashed var(--roze-diep);border-radius:20px;margin:10px;
    color:var(--marine);
  }
  .dropzone.sleep{background:#ffd7e9}
  .dropzone strong{font-size:1.15rem}
  .dropzone small{opacity:.75}
  .dz-icoon{font-size:2.6rem}

  .knoppen{display:flex;flex-direction:column;gap:.7rem;margin-top:1.1rem}
  button{
    font-family:var(--body);font-size:1.25rem;font-weight:700;
    border:none;border-radius:999px;padding:1rem 1.4rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:.6rem;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  button:focus-visible{outline:4px solid var(--wit);outline-offset:2px}
  button:active{transform:scale(.97)}
  .primair{
    background:linear-gradient(180deg,#ff5fae,var(--glitter));
    color:var(--wit);box-shadow:0 6px 0 #a3105c,var(--schaduw);
  }
  .primair:hover{transform:translateY(-2px)}
  .primair[disabled]{opacity:.6;cursor:wait}
  .secundair{
    background:var(--marine);color:var(--wit);font-size:1.05rem;
    box-shadow:0 5px 0 #101d4a;
  }
  .stil{
    background:transparent;color:var(--marine);font-size:.95rem;font-weight:600;
    text-decoration:underline;box-shadow:none;padding:.4rem;
  }
  .melding{
    margin-top:1rem;background:var(--wit);border-left:6px solid var(--blauw);
    border-radius:12px;padding:.8rem 1rem;font-size:.95rem;display:none;
  }
  .melding.zichtbaar{display:block}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
  footer{position:relative;z-index:1;margin-top:2rem;color:#7a1048;font-size:.85rem;text-align:center}
  @media (prefers-reduced-motion:reduce){
    .lijst.praat{animation:none}
    .hartjes span{animation:none}
    canvas#confetti{display:none}
  }
</style>
</head>
<body>
<div class="hartjes" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<header>
  <span class="eyebrow">9 september 2026 · 12:30 uur</span>
  <h1>Norah May zegt het zelf!</h1>
  <p class="sub">Tik op de knop en luister naar de uitnodiging 🎈</p>
</header>

<main class="toneel">
  <div class="ballon" id="ballon" aria-live="polite"></div>

  <div class="lijst" id="lijst">
    <label class="dropzone" id="dropzone" for="fotoInput">
      <span class="dz-icoon">📸</span>
      <strong>Zet hier de uitnodigingsfoto neer</strong>
      <small>Tik om te kiezen of sleep de foto hierheen.<br>De foto wordt op dit apparaat bewaard.</small>
    </label>
    <img id="foto" alt="Uitnodiging voor de verjaardag van Norah May, 9 jaar" hidden>
    <input type="file" id="fotoInput" accept="image/*" hidden>
  </div>

  <div class="knoppen">
    <button class="primair" id="spreek">🎤 Laat Norah het zeggen</button>
    <button class="secundair" id="meer" hidden>💌 Vertel wanneer het feestje is</button>
    <button class="stil" id="wissel" hidden>Andere foto kiezen</button>
  </div>

  <div class="melding" id="melding"></div>
</main>

<footer>Gezellig samen lunchen en plezier maken! · 09&nbsp;september&nbsp;2026</footer>

<script>
(function(){
  'use strict';

  /* ---- hartjes-decor ---- */
  var hartjes = document.querySelector('.hartjes');
  var emo = ['💗','💙','⭐','🎈','✨'];
  for (var i = 0; i < 14; i++){
    var s = document.createElement('span');
    s.textContent = emo[i % emo.length];
    s.style.left = (Math.random()*100) + 'vw';
    s.style.top = (Math.random()*100) + 'vh';
    s.style.animationDelay = (Math.random()*8) + 's';
    s.style.fontSize = (0.8 + Math.random()*1.2) + 'rem';
    hartjes.appendChild(s);
  }

  /* ---- foto laden + bewaren ---- */
  var OPSLAG = 'norah-uitnodiging-foto';
  var dropzone = document.getElementById('dropzone');
  var input = document.getElementById('fotoInput');
  var foto = document.getElementById('foto');
  var wissel = document.getElementById('wissel');

  function toonFoto(dataUri){
    foto.src = dataUri;
    foto.hidden = false;
    dropzone.style.display = 'none';
    wissel.hidden = false;
  }
  var bewaard = null;
  try { bewaard = localStorage.getItem(OPSLAG); } catch(e){}
  if (bewaard) toonFoto(bewaard);

  function verwerkBestand(file){
    if (!file || file.type.indexOf('image/') !== 0) return;
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1100;
      var schaal = Math.min(1, max / img.width);
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * schaal);
      c.height = Math.round(img.height * schaal);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var dataUri = c.toDataURL('image/jpeg', 0.88);
      URL.revokeObjectURL(url);
      toonFoto(dataUri);
      try { localStorage.setItem(OPSLAG, dataUri); } catch(e){}
    };
    img.src = url;
  }
  input.addEventListener('change', function(){ verwerkBestand(input.files[0]); });
  wissel.addEventListener('click', function(){ input.click(); });
  ['dragover','dragenter'].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.add('sleep'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.remove('sleep'); });
  });
  dropzone.addEventListener('drop', function(e){
    verwerkBestand(e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  /* ---- Nederlandse meisjesstem ---- */
  var melding = document.getElementById('melding');
  var stemmen = [];
  function laadStemmen(){ stemmen = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  laadStemmen();
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = laadStemmen;

  function kiesStem(){
    var nl = stemmen.filter(function(v){ return /^nl/i.test(v.lang); });
    if (!nl.length) return null;
    // Vrouwelijke Nederlandse stemmen eerst — hoge pitch maakt er een meisjesstem van.
    var voorkeur = ['fenna','colette','ellen','claire','lotte','xenia','google nederlands','female','vrouw'];
    for (var i = 0; i < voorkeur.length; i++){
      for (var j = 0; j < nl.length; j++){
        if (nl[j].name.toLowerCase().indexOf(voorkeur[i]) !== -1) return nl[j];
      }
    }
    var nietMan = nl.filter(function(v){ return !/xander|male|man/i.test(v.name); });
    return nietMan[0] || nl[0];
  }

  /* ---- spreken met tekstballon + confetti ---- */
  var ballon = document.getElementById('ballon');
  var lijst = document.getElementById('lijst');
  var spreek = document.getElementById('spreek');
  var meer = document.getElementById('meer');

  var ZIN = 'Je bent van harte uitgenodigd op mijn verjaardag!';
  var DETAILS = 'Het feestje is op negen september. We gaan om half één gezellig lunchen, en we zijn om kwart over vier weer terug. Kom je ook? Joepie!';

  function vulBallon(tekst){
    ballon.innerHTML = '';
    tekst.split(' ').forEach(function(w){
      var el = document.createElement('span');
      el.className = 'w';
      el.textContent = w + ' ';
      ballon.appendChild(el);
    });
    ballon.classList.add('zichtbaar');
  }

  function zeg(tekst, klaar){
    if (!window.speechSynthesis){
      melding.textContent = 'Dit apparaat kan helaas niet voorlezen. Probeer het op een telefoon of in Chrome/Safari/Edge.';
      melding.classList.add('zichtbaar');
      if (klaar) klaar();
      return;
    }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(tekst);
    u.lang = 'nl-NL';
    var stem = kiesStem();
    if (stem) u.voice = stem;
    else {
      melding.textContent = 'Er is geen Nederlandse stem op dit apparaat gevonden — de uitspraak kan daardoor anders klinken. Op een Android- of iPhone-toestel met Nederlands als taal klinkt het het best.';
      melding.classList.add('zichtbaar');
    }
    u.pitch = 1.7;   // hoog: zo klinkt de stem als een meisje van 9
    u.rate = 0.95;

    var woorden = ballon.querySelectorAll('.w');
    var idx = 0;
    u.onboundary = function(e){
      if (e.name && e.name !== 'word') return;
      if (idx < woorden.length) woorden[idx++].classList.add('aan');
    };
    u.onstart = function(){
      lijst.classList.add('praat');
      startConfetti();
      // fallback: geen boundary-events (o.a. Android) → alles meteen tonen
      setTimeout(function(){
        if (idx === 0) woorden.forEach(function(w){ w.classList.add('aan'); });
      }, 700);
    };
    u.onend = u.onerror = function(){
      woorden.forEach(function(w){ w.classList.add('aan'); });
      lijst.classList.remove('praat');
      stopConfetti();
      if (klaar) klaar();
    };
    speechSynthesis.speak(u);
  }

  spreek.addEventListener('click', function(){
    spreek.disabled = true;
    vulBallon(ZIN);
    zeg(ZIN, function(){
      spreek.disabled = false;
      spreek.textContent = '🎤 Nog een keer!';
      meer.hidden = false;
    });
  });
  meer.addEventListener('click', function(){
    meer.disabled = true;
    vulBallon(DETAILS);
    zeg(DETAILS, function(){ meer.disabled = false; });
  });

  /* ---- confetti ---- */
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var deeltjes = [], actief = false, raf = null;
  var beperkt = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function maat(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  maat(); addEventListener('resize', maat);
  var kleuren = ['#d81b7a','#ff5fae','#3f7fd6','#1d3272','#ffffff','#ffd400'];
  function startConfetti(){
    if (beperkt) return;
    actief = true;
    for (var i = 0; i < 90; i++){
      deeltjes.push({
        x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.5,
        vx: (Math.random()-0.5)*1.6, vy: 1.5 + Math.random()*2.5,
        r: 3 + Math.random()*5, hoek: Math.random()*Math.PI,
        kleur: kleuren[(Math.random()*kleuren.length)|0]
      });
    }
    if (!raf) teken();
  }
  function stopConfetti(){ actief = false; }
  function teken(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    deeltjes = deeltjes.filter(function(p){ return p.y < canvas.height + 20; });
    deeltjes.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.hoek += 0.08;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.hoek);
      ctx.fillStyle = p.kleur;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);
      ctx.restore();
    });
    if (deeltjes.length || actief){ raf = requestAnimationFrame(teken); }
    else { raf = null; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
})();
</script>
</body>
</html>
