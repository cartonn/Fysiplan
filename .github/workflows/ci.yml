# CI-poort: draait exact dezelfde build-keten als Railway (validators + build.js),
# zodat een rode build zichtbaar is op de commit/PR in plaats van stil op Railway.
# Les van 11-8-2026: de manifest-desync faalde twee weken onzichtbaar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:categories
      # De mobiele poorten draaiden tot nu toe alleen lokaal. Juist daar zit de
      # patiëntkaart: beoordeelde uitsnedes, teruggehouden beelden, houdlijsten en
      # de uitlevering van de stemopnames.
      - run: npm run test:mobile
      - run: node scripts/test-noor-playlist-races.mjs
      - run: npm run test:video-recovery
      - run: npm run test:drafts
      - run: npm run test:beheer
      - run: npm run test:proefpoort
      - run: npm run test:sweep
      - run: npm run test:offline
      - run: npm run test:tablet
      - run: npm run test:praktijkslot
      - run: npm run test:tezwaar
      - run: node scripts/test-praktijkgegevens.mjs
      - run: node scripts/test-kaart-weg.mjs
